services:
    database:
        image: pgvector/pgvector:pg17
        container_name: decktrack-database
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_NAME:-decktrack}
            POSTGRES_USER: ${DB_USERNAME:-decktrack}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-decktrack_dev}
        ports:
            - "127.0.0.1:${DB_PORT:-5433}:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./init.sql:/docker-entrypoint-initdb.d/001-enable-vector.sql:ro
        healthcheck:
            test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
            interval: 5s
            timeout: 5s
            retries: 5

volumes:
    postgres_data:
